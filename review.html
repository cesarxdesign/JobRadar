<meta charset="utf-8">
<title>JobRadar — review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e0f11;--panel:#17191c;--line:#24272c;--line2:#31353b;--fg:#e8eaed;--dim:#9aa0a6;--dimmer:#6b7075;--acc:#7aa2f7;--good:#7ec699;--bad:#e06c75;--warn:#e0af68}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6ea;--line2:#d3d7dd;--fg:#1a1c1e;--dim:#5f6368;--dimmer:#8a8f94;--acc:#3b5bdb;--good:#2f9e44;--bad:#c92a2a;--warn:#e8590c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0}
.note{color:var(--dim);font-size:12.5px}
.spacer{flex:1}
.tally{font-size:12.5px;color:var(--dim)}.tally b{color:var(--fg)}
.saved{font-size:11.5px;color:var(--good)}
.tabs{display:flex;gap:2px;padding:9px 20px 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 14px;font-size:13px;cursor:pointer}
.tab.on{color:var(--fg);border-bottom-color:var(--acc)}
.tab .n{color:var(--dimmer);margin-left:6px;font-size:11.5px}
.split{display:flex;height:calc(100vh - 92px)}
.list{width:40%;min-width:330px;overflow-y:auto;padding:12px 14px;border-right:1px solid var(--line)}
.pane{flex:1;overflow-y:auto;padding:20px 26px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card.pass{border-left-color:var(--good)}
.card.cut{border-left-color:var(--bad)}
.card.wrong{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
.card.sel{border-color:var(--acc)}
.card .n{color:var(--dimmer);font-size:11.5px;margin-right:6px}
.card .t{font-weight:600;font-size:13.5px}
.card .c{color:var(--dim);font-size:12.5px;margin-top:1px}
.card .m{margin-top:6px;font-size:11px;color:var(--dimmer)}
.card .w{float:right;font-size:10.5px;color:var(--warn);font-weight:600;letter-spacing:.5px}
.tag{border:1px solid var(--line2);border-radius:20px;padding:2px 8px;margin-right:5px;white-space:nowrap}
.tag.no{border-color:var(--bad);color:var(--bad)}
.tag.yes{border-color:var(--good);color:var(--good)}
.lane{font-weight:700;letter-spacing:.6px;font-size:10px;border-radius:4px;padding:2px 6px;margin-right:7px}
.lane.open{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.lane.pt{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.lane.un{background:color-mix(in srgb,var(--dim) 20%,transparent);color:var(--dim)}
.lane.cut{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.why{font-weight:700;letter-spacing:.5px;font-size:9.5px;border-radius:4px;padding:2px 6px;margin-right:7px}
.why.role{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.why.place{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc)}
.why.both{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
/* the change pill sits at the top right of the card: flex row, pushed over
   with margin-left:auto. float does nothing on a flex item. */
.chg{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
     letter-spacing:.5px;margin-left:auto;flex:0 0 auto;white-space:nowrap}
.chg .from{color:var(--dimmer);text-decoration:line-through}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .hd .t{flex:1}
.truth{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
.truth b{color:var(--fg)}
.chg .arw{color:var(--dimmer)}
.card.moved{border-left-color:var(--acc)}
h2{font-size:19px;margin:0 0 2px}
.co{color:var(--dim);margin-bottom:14px}
.verdict{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:14px}
.verdict .r{margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.fact{background:var(--panel);padding:8px 10px}
.fk{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dimmer);font-weight:600}
.fv{font-size:13px;margin-top:2px}
.acts{display:flex;gap:8px;margin:14px 0 18px;align-items:center}
.acts button{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:7px;padding:8px 16px;font-size:12.5px;cursor:pointer}
.acts button:hover{border-color:var(--acc);color:var(--acc)}
.acts button.wrong{border-color:var(--warn);color:var(--warn)}
.acts button.wrong.on{background:color-mix(in srgb,var(--warn) 18%,transparent);font-weight:600}
a{color:var(--acc)}
.jdh{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dimmer);font-weight:600;margin:16px 0 7px}
.jd{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 26px;
    font-size:14.5px;line-height:1.68;max-width:68ch}
.jd p{margin:0 0 1em}
.jd h4{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--dim);
       font-weight:700;margin:1.9em 0 .7em;padding-bottom:.4em;border-bottom:1px solid var(--line)}
.jd h4:first-child{margin-top:0}
.jd ul{margin:0 0 1.2em;padding-left:1.15em;list-style:none}
.jd li{margin:.42em 0;position:relative}
.jd li:before{content:"–";position:absolute;left:-1.15em;color:var(--dimmer)}
mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--fg);border-radius:2px;padding:0 2px}
.empty{color:var(--dimmer);padding:24px 0}
.view{display:flex;gap:6px;align-items:center;margin:16px 0 8px}
.view button{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:6px;
  padding:5px 12px;font-size:11.5px;cursor:pointer}
.view button.on{border-color:var(--acc);color:var(--acc)}
.view .hint{color:var(--dimmer);font-size:11.5px;margin-left:6px}
.frame{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.blocked{background:var(--panel);border:1px dashed var(--line2);border-radius:10px;
  padding:20px 22px;color:var(--dim);font-size:13px}
</style>

<header>
  <h1>JobRadar — review</h1><span class="note" id="note"></span>
  <span class="spacer"></span>
  <span class="tally" id="tally"></span><span class="saved" id="saved"></span>
</header>
<div class="tabs" id="tabs">
  <button class="tab on" data-b="pass">Pass<span class="n" id="c-pass"></span></button>
  <button class="tab" data-b="cut">Cut<span class="n" id="c-cut"></span></button>
  <button class="tab" data-b="changed">Changed<span class="n" id="c-changed"></span></button>
  <button class="tab" data-b="other">Other moves<span class="n" id="c-other"></span></button>
</div>
<div class="split"><div class="list" id="list"></div>
<div class="pane" id="pane"><div class="empty">Pick a role.</div></div></div>

<script>
"use strict";
let D=null, TAB="pass", SEL=0;
let VIEW=localStorage.getItem("radar2-view")||"page";   // "page" | "text"
const W={};                                  // "pass:3" -> true  (marked wrong)
try{ Object.assign(W, JSON.parse(localStorage.getItem("radar2-wrong")||"{}")); }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const HL=/\b(remote|hybrid|on-?site|portugal|lisbon|europe|EU|EMEA|worldwide|global|anywhere|germany|france|spain|UK|united kingdom|netherlands|poland|india|nigeria|timezone|time zone|CET|GMT|relocat\w*|eligib\w*|work permit|visa|years? of experience|senior|staff|principal|lead|head of|director)\b/gi;
// Key marks by the ROLE, not its position. Keying on bucket+row number meant
// a new batch inherited the previous batch's marks - row 1 is a different job
// every time.
const key=r=>(r.company+"|"+r.title).toLowerCase().replace(/[^a-z0-9|]+/g," ").trim();
const BATCH=(D&&D.note)||"";
const LANE={open:0,portugal:1,unsure:2};
// why a cut happened: role off, place off, or both. Sorting the Cut tab by
// this groups the two failure kinds instead of interleaving them.
function cutWhy(r){
  const roleNo = r.l2.role==="no", placeNo = r.l2.place==="no";
  return roleNo&&placeNo ? "both" : roleNo ? "role" : placeNo ? "place" : "other";
}
const CUTORDER={role:0,place:1,both:2,other:3};
const CUTLABEL={role:"ROLE OFF",place:"LOCATION OFF",both:"BOTH OFF",other:"CUT"};
const SHORT={open:"OPEN",portugal:"PT",unsure:"UN"};
const rows=()=>{
  const rs = TAB==="changed" ? D.roles.filter(r=>r.changed)
           : TAB==="other"   ? D.roles.filter(r=>r.other)
           : D.roles.filter(r=>r.bucket===TAB);
  // passes group by lane so the three states read as three blocks
  if(TAB==="changed"||TAB==="other") return rs.slice().sort((a,b)=>a.n-b.n);
  if(TAB==="cut") return rs.slice().sort((a,b)=>
      (CUTORDER[cutWhy(a)]-CUTORDER[cutWhy(b)])||a.n-b.n);
  return TAB==="pass"
    ? rs.slice().sort((a,b)=>(LANE[a.l2.lane]??9)-(LANE[b.l2.lane]??9)||a.n-b.n)
    : rs;
};

// marks go to disk as well as localStorage, so they can be read back here
let t=null;
function persist(){
  localStorage.setItem("radar2-wrong",JSON.stringify(W));
  clearTimeout(t);
  t=setTimeout(()=>{
    const payload=D.roles.filter(r=>W[key(r)]).map(r=>({key:key(r),bucket:r.bucket,n:r.n,
      company:r.company,title:r.title,url:r.url,location:r.location,l2:r.l2}));
    fetch("/api/marks",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)})
      .then(()=>{$("saved").textContent="saved";setTimeout(()=>$("saved").textContent="",1400);})
      .catch(()=>{$("saved").textContent="save failed";});
  },400);
}

function tally(){
  const w=D.roles.filter(r=>W[key(r)]);
  $("c-pass").textContent=D.roles.filter(r=>r.bucket==="pass").length;
  $("c-cut").textContent=D.roles.filter(r=>r.bucket==="cut").length;
  $("c-changed").textContent=D.roles.filter(r=>r.changed).length;
  $("c-other").textContent=D.roles.filter(r=>r.other).length;
  $("tally").innerHTML=`marked wrong <b>${w.length}</b> &nbsp;·&nbsp; `
    +`${w.filter(r=>r.bucket==="pass").length} bad passes, ${w.filter(r=>r.bucket==="cut").length} bad cuts`;
}

function renderList(){
  const rs=rows(); $("list").innerHTML="";
  rs.forEach((r,i)=>{
    const el=document.createElement("div");
    el.className="card "+r.bucket+(i===SEL?" sel":"")+(r.changed?" moved":"")+(W[key(r)]?" wrong":"");
    el.innerHTML=`<div class="hd">`
      +`<span class="t">${W[key(r)]?'<span class="w">WRONG</span> ':''}`
      +`<span class="n">${r.n}.</span>${esc(r.title)}</span>`
      +`${r.changed
           ? `<span class="chg"><span class="from">${r.prev}</span>`
             +`<span class="arw">&rarr;</span>`
             +`<span class="lane ${r.now==='CUT'?'cut':r.now==='PT'?'pt':r.now==='OPEN'?'open':'un'}">${r.now}</span></span>`
           : (r.bucket==="pass"
               ? `<span class="lane ${r.l2.lane==='portugal'?'pt':r.l2.lane==='open'?'open':'un'}">${SHORT[r.l2.lane]||'UN'}</span>`
               : `<span class="why ${cutWhy(r)}">${CUTLABEL[cutWhy(r)]}</span>`)}`
      +`</div>`
      +`<div class="c">${esc(r.company)}</div>`
      +`<div class="m"><span class="tag ${r.l2.role==='no'?'no':'yes'}">role ${r.l2.role}</span>`
      +`<span class="tag ${r.l2.place==='no'?'no':''}">place ${r.l2.place}</span>`
      +`<span class="tag">${esc((r.location||'—').slice(0,44))}</span></div>`;
    el.onclick=()=>{SEL=i;render();};
    $("list").appendChild(el);
  });
}

function renderPane(){
  const rs=rows(), r=rs[SEL];
  if(!r){$("pane").innerHTML='<div class="empty">Nothing here.</div>';return;}
  const f=r.fields||{};
  const fact=(k,v)=>`<div class="fact"><div class="fk">${k}</div><div class="fv">${esc(String(v??"—"))}</div></div>`;
  $("pane").innerHTML=
     `<h2>${r.n}. ${esc(r.title)}</h2>`
    +`<div class="co">${esc(r.company)} · ${esc(r.location||"—")} · ${esc(r.source||"")}`
    +(r.url?` · <a href="${esc(r.url)}" target="_blank" rel="noopener">open the posting ↗</a>`:"")+`</div>`
    + (r.changed ? `<div class="verdict" style="border-color:var(--acc)">`
        +`<b>Changed: ${r.prev} &rarr; ${r.now}</b>`
        +`${r.flagged?' &nbsp;·&nbsp; you flagged this':' &nbsp;·&nbsp; you had not flagged this'}</div>` : ``)
    +`<div class="verdict"><b>L2 ${r.l2.cut?"cut this":"passed this to "+r.l2.lane}.</b> `
    +`role=${r.l2.role} · place=${r.l2.place} · confidence=${r.l2.confidence}`
    +`<div class="r">${esc(r.l2.reason)}</div></div>`
    + (r.truth ? `<div class="truth"><b>Verified answer:</b> ${r.truth.cut?"CUT":r.truth.lane.toUpperCase()}`
        +` &nbsp;·&nbsp; ${esc(r.truth.reason||"")}</div>` : ``)
    +`<div class="facts">`+fact("remote",f.remote)+fact("portugal ok",f.portugal_ok)
    +fact("countries",(f.countries||[]).join(", ")||"—")+fact("seniority",f.seniority)
    +fact("salary",f.salary)+fact("years xp",f.years_xp)+fact("language",f.language)+`</div>`
    +`<div class="acts"><button id="b-w" class="wrong ${W[key(r)]?'on':''}">`
    +`${W[key(r)]?"✓ marked wrong":"Wrong"}</button>`
    +`<button id="b-n">next →</button>`
    +`<span class="note">j / k to move · w to mark</span></div>`
    +`<div class="view">`
      +`<button id="v-page" class="${VIEW==="page"?"on":""}">Page</button>`
      +`<button id="v-text" class="${VIEW==="text"?"on":""}">Text</button>`
      +`<span class="hint">${VIEW==="page"
          ? (canEmbed(r.url) ? "" : "this board refuses to embed — showing the scraped text, open the posting for the page")
          : (r.jd||"").length.toLocaleString()+" characters as scraped"}</span></div>`
    + (VIEW==="page" && r.url && canEmbed(r.url)
        ? `<iframe class="frame" src="${esc(r.url)}" referrerpolicy="no-referrer"
             sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>`
        : `<div class="jd">${fmtJD(r.jd||"(none)")}</div>`);
  const setView=v=>{VIEW=v;localStorage.setItem("radar2-view",v);render();};
  if($("v-page")) $("v-page").onclick=()=>setView("page");
  if($("v-text")) $("v-text").onclick=()=>setView("text");
  $("b-w").onclick=()=>toggle();
  $("b-n").onclick=()=>{if(SEL<rs.length-1){SEL++;render();}};
}

// Only greenhouse and ashby allow their page in an iframe. Everyone else
// sends frame-ancestors none and comes up blank, so they get the text.
const canEmbed = u => /greenhouse\.io|ashbyhq\.com/.test(u||"");

// A job description is a document, not a string. Render the structure the
// scrape now preserves: short standalone lines are headings, bullets are a
// list, everything else is a paragraph.
function fmtJD(t){
  const blocks=t.split(/\n{2,}|\n/).map(x=>x.trim()).filter(Boolean);
  let out="", inList=false;
  const hl=x=>esc(x).replace(HL,m=>"<mark>"+m+"</mark>");
  const closeList=()=>{ if(inList){out+="</ul>";inList=false;} };
  for(const b of blocks){
    if(/^[•\-\*\u2013]\s+/.test(b)){
      if(!inList){out+="<ul>";inList=true;}
      out+="<li>"+hl(b.replace(/^[•\-\*\u2013]\s+/,""))+"</li>";
      continue;
    }
    closeList();
    // a heading: short, no full stop, not a sentence fragment mid-flow
    const isHead = b.length<=64 && !/[.!?;,]$/.test(b) && b.split(" ").length<=9;
    out += isHead ? "<h4>"+hl(b)+"</h4>" : "<p>"+hl(b)+"</p>";
  }
  closeList();
  return out;
}

function toggle(){
  const r=rows()[SEL]; if(!r) return;
  if(W[key(r)]) delete W[key(r)]; else W[key(r)]=true;
  persist(); render();
}
function render(){renderList();renderPane();tally();}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  TAB=b.dataset.b;SEL=0;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  render();});

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  const rs=rows();
  if(e.key==="j"&&SEL<rs.length-1){SEL++;render();}
  if(e.key==="k"&&SEL>0){SEL--;render();}
  if(e.key==="w"){toggle();}
  if(e.key==="p"){VIEW=VIEW==="page"?"text":"page";localStorage.setItem("radar2-view",VIEW);render();}
});

fetch("data/review.json?t="+Date.now()).then(r=>r.json()).then(d=>{
  D=d;
  // a mark whose role is not in this batch is a leftover - drop it
  const live=new Set(D.roles.map(key));
  let dropped=0;
  for(const k of Object.keys(W)) if(!live.has(k)){delete W[k];dropped++;}
  if(dropped) localStorage.setItem("radar2-wrong",JSON.stringify(W));
  $("note").textContent=d.note+(dropped?`  ·  cleared ${dropped} marks from an earlier batch`:"");
  render();
}).catch(()=>{$("pane").innerHTML='<div class="empty">no data/review.json yet — batch still running</div>';});
</script>
