# Radar2 nightly: pool -> judge -> results, committed back so the board is
# fresh by morning. 22:00 UTC is 23:00 in Lisbon through October and 22:00
# after the clocks change; either way it is done long before 9am.
#
# Secrets (repo settings, never in this file, never in the tree):
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` on the Mac. The judge
#                            runs the same `claude -p` it runs locally.
name: nightly
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
concurrency:
  group: nightly
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - name: pool
        run: python3 pool.py
      - name: judge
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 judge.py
      - name: results
        run: python3 results.py
      - name: commit
        run: |
          git config user.name "Radar2 nightly"
          git config user.email "cesarxdesign@gmail.com"
          git add data/pool.json data/reads.json data/verdicts.json data/results.json
          git diff --cached --quiet || git commit -m "nightly $(date -u +%F)"
          git push
