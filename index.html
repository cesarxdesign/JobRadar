<meta charset="utf-8">
<title>JobRadar</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e0f11;--panel:#17191c;--line:#24272c;--fg:#e8eaed;--dim:#9aa0a6;--dimmer:#6b7075;--acc:#7aa2f7;--good:#7ec699;--warn:#e0af68;--bad:#ff6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6ea;--fg:#1a1c1e;--dim:#5f6368;--dimmer:#8a8f94;--acc:#3b5bdb;--good:#2f9e44;--warn:#e8590c;--bad:#e03131}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;margin:0;letter-spacing:-.2px}
.stamp{color:var(--dim);font-size:12.5px}
.spacer{flex:1}
.route{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer}
.route:hover{border-color:var(--acc);color:var(--acc)}
.q{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 11px;font-size:12.5px;min-width:220px}
.q:focus{outline:none;border-color:var(--acc)}
.route.on{border-color:var(--acc);color:var(--acc)}
.route.done{border-color:var(--good);color:var(--good)}
.wrong{border-color:var(--warn)!important;color:var(--warn)!important}
.wrong.on{background:var(--warn);color:#fff!important;border-color:var(--warn)!important}
.bucket{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dimmer);font-weight:600;margin:14px 0 6px 46px}
.route.drop{border-color:var(--acc);color:var(--acc);border-style:dashed}
.route[disabled]{opacity:.5;cursor:wait}
.tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{align-items:center}
.tabs select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12.5px;align-self:center;margin-right:8px}
.tabs #f-sort{margin:0 0 0 12px}
.tabs .safari{color:var(--dim);font-size:12.5px;display:flex;align-items:center;gap:4px;cursor:pointer;margin-left:12px}
.tabs .sep{width:1px;height:18px;padding:0;margin:0 10px;background:var(--line);border:0;cursor:default}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 12px;font-size:13px;cursor:pointer}
.tab.on{color:var(--fg);border-bottom-color:var(--acc)}
.tab .n{color:var(--dimmer);margin-left:6px;font-size:11.5px}
.split{display:flex;height:calc(100vh - 108px)}
.list{width:60%;min-width:340px;overflow-y:auto;padding:12px 16px;border-right:1px solid var(--line)}
.pane{flex:1;overflow-y:auto;padding:20px 24px}
.split.nopane .pane{display:none}
.split.nopane .list{width:100%;border-right:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px}
.card:hover,.card.sel{border-color:var(--acc)}
.card .days{flex:none;width:34px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.card .body{flex:1;min-width:0}
.card .t{font-weight:600}
.card .t a{color:inherit;text-decoration:none}
.card .t a:hover{color:var(--acc);text-decoration:underline}
.card .acts{flex:none;margin:0;gap:5px}
.card .acts button{padding:4px 10px}
.card .acts .star{padding:4px 8px;font-size:13px}
.card .acts .star.on{color:var(--warn);border-color:var(--warn)}
.card .acts button.on{color:var(--fg);border-color:var(--fg);cursor:default}
.jd{margin-top:16px;font-size:13px;line-height:1.55;color:var(--fg)}
.jd h4{font-size:12px;margin:14px 0 4px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.jd p{margin:0 0 8px}
.jd ul{margin:0 0 8px 18px;padding:0}
.jd li{margin:2px 0}
.jd .none{color:var(--dimmer)}
.sect{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dimmer);font-weight:600;margin:14px 0 6px 46px}
.card{align-items:stretch}
.card .days{align-self:center}
.card .side{flex:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:10px}
.card .causes{display:flex;gap:5px;min-height:1px}
.card .causes .tag{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.tag.c-ok{border-color:var(--good);color:var(--good)}
.tag.c-bad{border-color:var(--bad);color:var(--bad)}
.tag.c-off{border-color:var(--line);color:var(--dimmer)}
.tag.c-who{border:0;color:var(--dimmer);padding-left:2px;padding-right:0;letter-spacing:.8px}
.card .c{color:var(--dim);font-size:12.5px}
.meta{display:flex;flex-wrap:wrap;gap:5px 7px;margin-top:7px;font-size:11px;color:var(--dimmer)}
.days.approx{color:var(--dim);font-style:italic}
.tag{border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.tag.y{border-color:var(--good);color:var(--good)}
.tag.n{border-color:var(--warn);color:var(--warn)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer}
.acts button:hover{border-color:var(--acc);color:var(--acc)}
.empty{color:var(--dimmer);padding:20px 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:14px 0}
.fact{background:var(--panel);padding:9px 11px}
.fk{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dimmer);font-weight:600}
.fv{font-size:13px}
.why{margin-top:14px;font-size:12px;color:var(--dim)}
.why li{margin:2px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 15px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.verdict{border:1px solid var(--bad);border-radius:9px;padding:12px 14px;margin:14px 0 4px;font-size:13px}
.verdict .vq{display:flex;gap:10px;align-items:baseline;margin:0 0 6px}
.verdict .vq+.vq,.verdict ul+.vq{margin-top:12px}
.verdict .k{flex:none;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:1px 7px}
.verdict .h{font-weight:600}
.verdict ul{margin:0 0 0 18px;padding:0;color:var(--dim)}
.verdict li{margin:2px 0}
.verdict .in{color:var(--good)}.verdict .out{color:var(--bad)}
.flag,.verdict .flag{flex:none;background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:1px 8px;font-size:11px;cursor:pointer}
.flag:hover,.verdict .flag:hover{border-color:var(--bad);color:var(--bad)}
.flag.on,.verdict .flag.on{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict.ok{border-color:var(--line)}
.verdict .k.ok{color:var(--good);border-color:var(--good)}
.notes{margin:12px 0 4px}
.notes textarea{width:100%;min-height:64px;margin-top:6px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical}
.notes textarea:focus{outline:none;border-color:var(--acc)}
.notes .past{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:13px}
.notes .past .ans{color:var(--acc);margin-top:3px}
.notes .past .when{color:var(--dimmer);font-size:11px;margin-top:2px}
.verdict .sum{margin-top:10px;color:var(--dim);font-size:12px}
[hidden]{display:none!important}
</style>

<header>
  <h1>JobRadar</h1>
  <span class="stamp" id="stamp">loading…</span>
  <span class="spacer"></span>
  <span class="stamp" id="batch-when"></span>
  <button class="route" id="batch" hidden>Review last batch</button>
  <button class="route" id="export" hidden title="write the decision history for Claude to read">⇱ Export history</button>
  <button class="route" id="route">⇱ RadarRoute</button>
</header>

<div class="tabs" id="tabs">
  <select id="f-last" title="how long since the job was posted or last updated, on every tab; the ranges do not overlap">
    <option value="" selected>all</option>
    <option value="1">1 day</option>
    <option value="7">1 week</option>
    <option value="30">1 month</option>
    <option value="?">?</option>
  </select>
  <button class="tab on" data-lane="open">Open<span class="n" id="c-open"></span></button>
  <button class="tab" data-lane="portugal">Portugal<span class="n" id="c-portugal"></span></button>
  <button class="tab" data-lane="unsure">Unsure<span class="n" id="c-unsure"></span></button>
  <button class="tab rr" data-lane="old69" hidden>45+<span class="n" id="c-old69"></span></button>
  <span class="tab rr sep" hidden></span>
  <button class="tab rr" hidden data-lane="agency" title="companies you moved here from the preview: the ones that flood the boards with the same roles">Bundlers<span class="n" id="c-agency"></span></button>
  <button class="tab rr" data-lane="review" hidden title="everything waiting on you: rejections VISION’s second read disagreed with, roles where the filter disagrees with what you did, and your own flags, moves and open notes">For Reviewing<span class="n" id="c-review"></span></button>
  <button class="tab rr" data-lane="favorites" hidden>Favorites<span class="n" id="c-favorites"></span></button>
  <span class="tab rr sep" hidden></span>
  <button class="tab rr" data-lane="applied" hidden>Applied<span class="n" id="c-applied"></span></button>
  <button class="tab rr" data-lane="discarded" hidden>Discarded<span class="n" id="c-discarded"></span></button>
  <button class="tab bt" data-lane="pass" hidden>Passed<span class="n" id="c-pass"></span></button>
  <button class="tab bt" data-lane="cut" hidden>Cut<span class="n" id="c-cut"></span></button>
  <span class="spacer"></span>
  <label class="safari" title="job links open in Safari; the board stays in Chrome because only Chrome can read and write the routing file"><input type="checkbox" id="f-safari"> Safari</label>
  <label class="safari" title="hide the preview on the right and let the list take the full width"><input type="checkbox" id="f-pane"> Hide preview</label>
  <select id="f-sort" title="order by the posting's age">
    <option value="new">newest first</option>
    <option value="old">oldest first</option>
  </select>
</div>

<div class="split" id="split">
  <div class="list" id="list"></div>
  <div class="pane" id="pane"><div class="empty">Select a role.</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// The board renders results.json and nothing else. It applies no criteria of
// its own - the lane a role is in was decided by the judge, upstream.
let DATA = null, LANE = "open", SEL = null;
// The batch view: the same board, showing the sample the judge just drew,
// split pass / cut, with a Wrong button per role. Nothing else changes -
// same cards, same pane, same search.
let BATCH = null, INBATCH = false, BUCKET = "pass", W = {};
const wkey = r => (r.company + "|" + r.title).toLowerCase();
// Routing is absent until the one RadarRouting file on the planet is dropped
// here. Nothing about it is stored in this browser.
let RR = null, RRH = null, STORED = null;
// The review batch and the history export are tools for the local server.
// On the public URL nobody gets them - not the buttons, not the batch file.
const LOCAL = ["localhost","127.0.0.1"].includes(location.hostname);
const $ = id => document.getElementById(id);
const esc = s => (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600);}

// ---------- render ----------
function roleById(id){
  if(INBATCH){const b=BATCH.roles.find(r=>r.id===id);if(b) return b;}
  return DATA.roles.find(r=>r.id===id)||ghost(id);
}
// A mark is the whole point of the batch, so it goes to disk on the click.
function markWrong(r){
  const k=wkey(r);
  if(W[k]) delete W[k]; else W[k]={key:k,company:r.company,title:r.title,url:r.url,
                                   bucket:r.bucket,lane:r.l2&&r.l2.lane,reason:r.l2&&r.l2.reason};
  fetch("/api/marks",{method:"POST",body:JSON.stringify(Object.values(W))}).catch(()=>{});
  render();
}
function setBatch(on){
  INBATCH=on;SEL=null;
  document.querySelectorAll(".tab:not(.bt)").forEach(t=>{t.hidden=on||(t.classList.contains("rr")&&!RR);});
  document.querySelectorAll(".tab.bt").forEach(t=>{t.hidden=!on;t.classList.toggle("on",on&&t.dataset.lane===BUCKET);});
  if(!on) document.querySelectorAll(".tab:not(.bt)").forEach(t=>t.classList.toggle("on",t.dataset.lane===LANE));
  const b=$("batch");
  b.className="route"+(on?" on":"");
  b.textContent=on?"✓ Complete review":"Review last batch";
  b.title=on?"archive this batch and release its roles to the board"
           :"the sample the judge drew for sense checking";
  render();
}
async function completeBatch(){
  const n=Object.keys(W).length;
  if(!confirm("Complete this review?\n\n"+BATCH.roles.length+" roles, "+n+" marked wrong."
      +"\nThe batch is archived as a fixture and its roles rejoin the board.")) return;
  const b=$("batch");b.disabled=true;b.textContent="archiving…";
  try{
    const r=await fetch("/api/complete-batch",{method:"POST",body:"{}"});
    const d=await r.json();
    if(!d.ok) throw new Error(d.msg||"failed");
    BATCH=null;W={};b.hidden=true;$("batch-when").textContent="";
    setBatch(false);
  }catch(e){alert("Not archived: "+e.message);b.textContent="✓ Complete review";}
  finally{b.disabled=false;}
}
// A decision outlives the posting. results.json ships only active, judged
// roles, so a role he applied to that the company takes down - or that a
// later criteria run cuts before the judge reaches it - would vanish from
// Applied with no trace. The routing file stores the company and title with
// every decision, so the board can still show it, marked gone.
function ghost(id){
  if(!RR) return null;
  const d=RR.decisions.find(x=>x.id===id);
  if(d) return {id:d.id,company:d.company||"",title:d.title||"",url:d.url,active:true,gone:true,
            posted:d.at,first_seen:d.at,verdict:{why:[],fields:{}}};
  const b=batOf(id);
  return b?{id:b.id,company:b.company||"",title:b.title||"",url:b.url,active:true,gone:true,posted:b.posted,first_seen:b.posted,
            location:b.location,source:b.source,verdict:{why:[b.why].filter(Boolean),fields:{}}}:null;
}
// ---------- For Reviewing ----------
// One place for everything that waits on him, in the order it matters:
//   1 a cut the second reading disagreed with (one cut in ten is re-read)
//   2 a role where the filter disagrees with what he did (the battery)
//   3 his own flags, moves and notes not yet answered
function reviewRows(){
  if(!RR||!DATA) return [];
  const seen=new Set(), out=[], add=r=>{if(r&&!seen.has(r.id)){seen.add(r.id);out.push(r);}};
  (DATA.review||[]).map(roleById).filter(r=>r&&!routing(r.id)&&!auditSeen(r.id)).forEach(add);
  batRows().filter(r=>!(batOf(r.id)||{}).soft).forEach(add);
  DATA.roles.filter(r=>challenged(r)).forEach(add);
  (RR.flags||[]).concat(RR.retags||[],(RR.notes||[]).filter(n=>!n.reviewed))
    .filter(x=>!DATA.roles.some(r=>r.id===x.id))
    .forEach(x=>add({id:x.id,company:x.company,title:x.title,url:x.url,active:true,gone:true,posted:x.at,first_seen:x.at,verdict:{why:[],fields:{}}}));
  return out;
}
// A second-reading disagreement he has ruled on leaves the list.
const auditSeen=id=>(RR&&RR.audit_calls||[]).some(x=>x.id===id);
function auditCall(r,call){
  RR.audit_calls=(RR.audit_calls||[]).filter(x=>x.id!==r.id).concat([{id:r.id,call,company:r.company,title:r.title,url:r.url,at:new Date().toISOString()}]);
  writeRR(); toast(call==="wrong"?"marked: wrongly rejected":"marked: the rejection was right"); render();
}
function auditBox(r){
  const a=(r.verdict||{}).audit; if(!a) return "";
  const row=(k,h)=>h?'<div style="display:grid;grid-template-columns:84px 1fr;gap:10px;padding:5px 0;border-top:1px solid var(--line)"><span style="color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px">'+k+'</span><span>'+h+'</span></div>':"";
  const sig=(a.signals||[]).map(x=>'<li><span class="'+(x.says==="portugal_in"?"in":"out")+'">'+esc(String(x.says||"").replace("portugal_","Portugal "))
      +'</span> · '+esc(x.kind||"")+': “'+esc(x.quote||"")+'”</li>').join("");
  return '<div class="why" style="border-color:var(--warn)"><div style="font-weight:600;padding-bottom:6px">VISION’s second read disagrees with this rejection</div>'
    + row("first", "REJECTED · "+esc((r.verdict||{}).reason||""))
    + row("second", esc(String(a.lane||"").toUpperCase())+" · "+esc(a.reason||""))
    + (sig?row("statements",'<ul style="margin:0;padding-left:16px">'+sig+'</ul>'):"")
    + '<div style="display:flex;gap:8px;padding-top:8px"><button class="flag" id="aud-wrong">Wrongly rejected</button><button class="flag" id="aud-right">The rejection was right</button></div></div>';
}

// ---------- Battery ----------
// battery.py holds what he did against what the filter says and writes every
// disagreement into the routing file. One card each; the pane says why.
const batFails=()=>(RR&&RR.battery&&RR.battery.fails)||[];
const batOf=id=>batFails().find(x=>x.id===id);
function batRows(){
  return batFails().slice().sort((a,b)=>(a.soft?1:0)-(b.soft?1:0)).map(b=>{
    const r=DATA.roles.find(x=>x.id===b.id);
    if(r) return r;
    const g=ghost(b.id)||{id:b.id,active:true,gone:true};
    return {...g,company:g.company||b.company||"",title:g.title||b.title||"",url:g.url||b.url,location:b.location,source:b.source,
      verdict:{why:[b.why].filter(Boolean),reason:b.why,role:b.role,place:b.place,signals:b.signals||[],quote:b.quote,
               read:b.read,read_url:b.read_url,lane:b.lane,stage:b.by==="vision"?"vision":"judge",fields:{}}};
  });
}
function batteryBox(r){
  const b=batOf(r.id); if(!b) return "";
  const B=RR.battery, row=(k,h)=>h?'<div style="display:grid;grid-template-columns:84px 1fr;gap:10px;padding:5px 0;border-top:1px solid var(--line)"><span style="color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px">'+k+'</span><span>'+h+'</span></div>':"";
  const sig=(b.signals||[]).map(x=>'<li><span class="'+(x.says==="portugal_in"?"in":"out")+'">'+(x.says==="portugal_in"?"Portugal in":"Portugal OUT")
      +'</span> · '+esc(x.where||"")+': “'+esc(x.quote||"")+'”</li>').join("");
  return '<div class="why" style="border-color:var(--acc)"><div style="font-weight:600;padding-bottom:6px">Battery · '+esc(b.kind)+'</div>'
    + row("you", esc(b.his||""))
    + row("filter", esc((b.lane||"").toUpperCase())+" · by "+esc(b.by||"")+(b.read?" · read on "+(b.read==="employer"?"the employer’s page":"a job board’s copy"):"")
        +(b.read_at?" · "+esc(String(b.read_at).slice(0,10)):"")+(b.read_criteria?" · rules "+esc(b.read_criteria):""))
    + row("failed on", esc(b.failed_on||""))
    + row("its reason", esc(b.why||""))
    + row("top line", esc(b.top_line||""))
    + (sig?row("statements",'<ul style="margin:0;padding-left:16px">'+sig+'</ul>'):"")
    + row("closed?", b.open_quote?"“"+esc(b.open_quote)+"”":"")
    + row("posting", (b.still_up?"still up":"no longer up: cannot be read again")+(b.location?" · pool location: "+esc(b.location):""))
    + (b.page?'<details style="padding:5px 0;border-top:1px solid var(--line)"><summary>the page as the reader saw it</summary><pre style="white-space:pre-wrap;font:12px/1.45 inherit;max-height:420px;overflow:auto">'+esc(b.page)+'</pre></details>'
             :row("page","No saved copy: it was read before pages were kept, or by the old judge."))
    + row("run", esc(B.at)+' · rules '+esc(B.criteria)+' · '+B.failing+' of '+B.cases+' disagree')+'</div>';
}
function decided(lane){
  if(!RR) return [];
  const ids=new Set(DATA.roles.map(r=>r.id));
  return RR.decisions.filter(d=>d.decision===lane&&!ids.has(d.id)).map(d=>ghost(d.id)).filter(Boolean);
}
function routing(id){return RR ? (RR.decisions.find(d=>d.id===id)||{}).decision || null : null;}
// A favorite is a favorite whatever else happens to it. It lives in the
// routing file beside the decisions and shows the role's current state.
function fav(id){return !!(RR&&RR.favorites.includes(id));}
// There is no review mode: the board is the review. With the routing file
// attached every role shows the filter's reasoning and the tools to answer
// it, and each answer means something different:
//   wrong?        that part of the reasoning is wrong  -> feedback on the filter
//   move to lane  the filter put it in the wrong place -> feedback on the filter
//   a note        anything else                         -> feedback on the filter
//   applied / discard  what he did with the job        -> evidence for testing
// Feedback is never acted on by itself. It is read in a session and
// discussed with him first.
const LANE_NAME={open:"Open",portugal:"Portugal",unsure:"Unsure",closed:"Closed",cut:"Cut"};
const flagOf=id=>RR&&(RR.flags||[]).find(x=>x.id===id);
function toggleFlag(r,k){
  const v=r.verdict||{};
  let f=flagOf(r.id);
  if(!f){f={id:r.id,at:new Date().toISOString(),wrong:[],label:labelOf(r),company:r.company,title:r.title,url:r.url,
            read:v.read,read_url:v.read_url,role:v.role,place:v.place,reason:v.reason,signals:v.signals,quote:v.quote,by:reader(r)};
         RR.flags=[...(RR.flags||[]),f];}
  f.wrong=f.wrong.includes(k)?f.wrong.filter(x=>x!==k):[...f.wrong,k];
  f.at=new Date().toISOString();
  if(!f.wrong.length) RR.flags=RR.flags.filter(x=>x.id!==r.id);
  writeRR();render();
}
// Who read this role: the vision pass (the real page, in a browser) or the
// old judge (pasted-together text, never the page). Old-judge calls are the
// ones least to be trusted, and the board says which is which.
const reader=r=>{const v=r.verdict||{};return v.stage==="vision"||v.read_at?"vision":"judge";};
const challenged=r=>!!(flagOf(r.id)||retagOf(r.id)||openNote(r.id));
// Tagged wrong: it stays where it is while he is on it - he may tag more than
// one reason - and leaves the lane for For Reviewing when he selects another.
const parked=r=>!!flagOf(r.id)&&r.id!==SEL;
// A retag is him overruling the filter on one role: "you called this Unsure,
// it is Open". It is kept with what the filter said and why, it moves the
// role to the lane he gave it, and it is what gets discussed afterwards.
const RETAG=["open","unsure","cut"];
const retagOf=id=>RR&&(RR.retags||[]).find(x=>x.id===id);
function retag(r,to){
  const was=retagOf(r.id), v=r.verdict||{};
  RR.retags=(RR.retags||[]).filter(x=>x.id!==r.id);
  if(!was||was.to!==to)
    RR.retags.push({id:r.id,at:new Date().toISOString(),from:was?was.from:labelOf(r),to,company:r.company,title:r.title,
      url:r.url,why:v.why,read:v.read,read_url:v.read_url,stage:v.stage,by:reader(r),
      role:v.role,place:v.place,reason:v.reason,signals:v.signals});
  writeRR();render();
}
// The ids a lane shows: the filter's, minus what he retagged away, plus what he retagged in.
function laneIds(l){
  let base=l==="closed"?DATA.closed||[]:l==="cut"?(DATA.vcut||[]).concat(DATA.cut||[]):DATA.lanes[l]||[];
  if(RR&&(RR.multihire_off||[]).length)
    base=base.concat((DATA.agency||[]).filter(i=>{const r=roleById(i);return r&&(r.verdict||{}).lane===l&&!isMulti(r);}));
  if(!RR||!(RR.retags||[]).length) return base;
  const moved=new Map(RR.retags.map(x=>[x.id,x.to]));
  return base.filter(i=>!moved.has(i)).concat(RR.retags.filter(x=>x.to===l).map(x=>x.id));
}
// What the filter called a role: its lane, or Closed / Cut.
function labelOf(r){
  const v=r.verdict||{};
  if((DATA.closed||[]).includes(r.id)) return "closed";
  if((DATA.vcut||[]).includes(r.id)||(DATA.cut||[]).includes(r.id)) return "cut";
  return laneOf(r)||v.lane||null;
}
// The stamp a role carries once he has acted on it. Decisions made before
// stamps existed have none, and say so rather than guess.
function stampOf(id){
  if(!RR) return null;
  const d=RR.decisions.find(x=>x.id===id), w=(RR.incorrect||[]).find(x=>x.id===id);
  if(!d&&!w) return null;
  return (d&&(d.label||d.lane))||(w&&(w.label||w.lane))||"not labeled";
}
function toggleFav(id){RR.favorites=fav(id)?RR.favorites.filter(x=>x!==id):[...RR.favorites,id];writeRR();render();}
const LANES=["open","portugal","unsure"];
const PASS=["open","portugal"];
const laneOf=r=>LANES.find(l=>(DATA.lanes[l]||[]).includes(r.id));
const stateOf=r=>routing(r.id)||laneOf(r)||"cut";

// Days the posting has been open: from the date the board gives, else the
// day the pool first saw it. Every lane sorts freshest first.
// His call, 2026-10-06: the last update is the date that matters, on every
// job. So the age, the range picker and the order all run on the newest of:
// the site's own updated date, the day the pool saw the posting change, and
// the posting date. A posting from March that was edited last week is a week old.
const fresh=r=>[r.updated,r.changed,r.posted].filter(Boolean).map(x=>String(x).slice(0,10)).sort().pop()||"";
const edited=r=>{const u=[r.updated,r.changed].filter(Boolean).map(x=>String(x).slice(0,10)).sort().pop();
  return u&&u!==String(r.posted||"").slice(0,10)?u:"";};
function days(r){
  const d=Date.parse(fresh(r)||r.first_seen||"");
  return isNaN(d)?null:Math.max(0,Math.floor((Date.now()-d)/86400000));
}
// Some boards print no date anywhere - not in the header, the side panel, the
// body or the metadata. For those the age is measured from the day the radar
// first saw the posting, which is a floor and not the truth: the posting is at
// least this old. Shown as "≥12d" so it never reads as a real posting date.
const dated=r=>!!fresh(r);
// "0d" on a role whose posting carries no date reads as a bug, and it is a
// lie either way - we do not know the age, we only know when we first saw it.
// Say so: "?" until a day has passed, then "≥3d", which is true.
function ageLabel(r,d){
  if(d===null) return "—";
  if(dated(r)) return d===0?"today":d+"d";
  return d===0?"?":"≥"+d+"d";
}
// A job with no date at all goes to the bottom, whichever way the list is
// ordered: "?" means long ago, we do not know (his call, 2026-10-06).
const byDays=(a,b)=>{const x=days(a),y=days(b);return (!dated(a))-(!dated(b))||(x===null)-(y===null)||x-y;};
// The window in front of the tabs: the last N days, on every tab. Remembered per browser.
let LAST="";
try { LAST = localStorage.getItem("radar-last") || ""; } catch (e) {}
if(!["","1","7","30","?"].includes(LAST)) LAST="";      // "3 months" is gone: back to all
// Anything over 69 days leaves the three lanes and collects in its own. A
// role that has been open ten weeks is a different kind of thing from a fresh
// one - mostly it is an aggregator keeping a dead posting alive to pad its
// count - and it should not sit in the same list as something posted today.
const OLD_DAYS=45;        // the same 45 days CUT uses (his call, 2026-10-06); it was 69
const isOld=r=>{const d=days(r);return d!==null&&d>OLD_DAYS;};
let SORT="new";
function sortRows(rows){
  if(SORT==="old") return rows.sort((a,b)=>(!dated(a))-(!dated(b))||byDays(b,a));
  return rows.sort(byDays);
}

// The board has to run in Chrome - it is the only browser that can read and
// write the routing file - but a job posting is nicer to read anywhere else.
// Safari claims x-safari-https:, so an https link handed that scheme opens
// there while this page stays put. Per-browser setting, off by default.
let SAFARI = true;      // on unless he switched it off
try { SAFARI = localStorage.getItem("radar-safari") !== "0"; } catch (e) {}
function outbound(u){
  return SAFARI && /^https:\/\//i.test(u || "") ? "x-safari-" + u : u;
}

function matches(r){
  // A role whose posting carries no date has no place in a window of days:
  // it sits under "?" (and under "all time"), never under "last 1 day".
  // Bands, not ceilings: "1 week" is the last 7 days without the last day, "1
  // month" the last 30 without the last 7, and so on, so no role shows under
  // two ranges. Only "all time" holds everything. A posting carries a date,
  // not an hour, so "1 day" is today and yesterday.
  if(LAST==="?"){ if(dated(r)) return false; }
  else if(LAST){
    const d=days(r), lo={1:0,7:2,30:8}[LAST];
    if(!dated(r) || d===null || d < lo || d > +LAST) return false;
  }
  return true;
}

function wireFilters(){
  const so=$("f-sort");
  if(so) so.onchange=()=>{SORT=so.value;render();};
  const la=$("f-last");
  if(la){ la.value=LAST; la.onchange=()=>{LAST=la.value;try{localStorage.setItem("radar-last",LAST);}catch(e){}render();}; }
  // The preview pane, hidden when he would rather scan the list at full width
  // and read postings in their own tab. Remembered per browser.
  const pn=$("f-pane"), sp=$("split");
  if(pn && sp){
    let hide=false;
    try{hide=localStorage.getItem("radar-nopane")==="1";}catch(e){}
    pn.checked=hide; sp.classList.toggle("nopane",hide);
    pn.onchange=()=>{sp.classList.toggle("nopane",pn.checked);
      try{localStorage.setItem("radar-nopane",pn.checked?"1":"0");}catch(e){}};
  }
  const sf=$("f-safari");
  if(sf){
    sf.checked=SAFARI;
    sf.onchange=()=>{SAFARI=sf.checked;
      try{localStorage.setItem("radar-safari",SAFARI?"1":"0");}catch(e){}
      render();};
  }
}

function pool(){
  if(!DATA) return [];
  if(INBATCH) return BATCH.roles.filter(r=>r.bucket===BUCKET).filter(matches)
    .sort((a,b)=>a.n-b.n);
  let rows;
  if(LANE==="review") return reviewRows().filter(matches);
  if(LANE==="favorites") rows=DATA.roles.filter(r=>r.active && fav(r.id))
      .concat((RR?RR.favorites:[]).filter(id=>!DATA.roles.some(r=>r.id===id)).map(ghost).filter(Boolean));
  else if(LANE==="applied"||LANE==="discarded")
    rows=DATA.roles.filter(r=>r.active && routing(r.id)===LANE).concat(decided(LANE))
      .concat(LANE==="applied"?LANES.flatMap(laneIds).map(roleById).filter(r=>r&&!routing(r.id)&&appliedSame(r)):[]);
  // a role you have acted on leaves the first three lanes
  else if(LANE==="incorrect")
    rows=(RR?RR.incorrect||[]:[]).map(x=>roleById(x.id)||{id:x.id,company:x.company,title:x.title,url:x.url,active:true,gone:true,
      posted:x.at,first_seen:x.at,verdict:{why:x.why||[],fields:{}}});
  else if(LANE==="agency")
    rows=sortRows(multiIds().map(roleById).filter(r=>r && !routing(r.id) && matches(r)));
  else if(LANE==="unread")
    rows=sortRows((DATA.unread||[]).map(roleById).filter(r=>r && !routing(r.id) && matches(r)));
  else if(LANE==="closed"||LANE==="vcut")
    rows=laneIds(LANE==="vcut"?"cut":"closed").map(roleById).filter(r=>r && !routing(r.id));
  else if(LANE==="old69")
    rows=["open","portugal","unsure"].flatMap(laneIds)
      .map(roleById).filter(r=>r && !routing(r.id) && isOld(r) && !isMulti(r) && !appliedSame(r) && !parked(r));
  else rows=laneIds(LANE).map(roleById).filter(r=>r && !routing(r.id) && !(RR&&isOld(r)) && !isMulti(r) && !appliedSame(r) && !parked(r));
  rows=rows.filter(matches);
  if(LANE!=="favorites") return sortRows(rows);
  const order=["open","portugal","unsure","applied","discarded","cut"];
  return rows.sort((a,b)=>order.indexOf(stateOf(a))-order.indexOf(stateOf(b))||byDays(a,b));
}

// The top line: how many roles are open for him right now (the Open tab over
// all time), and when the sources were last read - all of them, and some.
function stamp(){
  if(!DATA) return;
  const when=t=>{const d=new Date(t||"");return isNaN(d)?"—":d.toLocaleString("sv-SE").slice(0,16);};
  const n=laneIds("open").map(roleById)
    .filter(r=>r&&!routing(r.id)&&!(RR&&isOld(r))&&!isMulti(r)&&!appliedSame(r)&&!parked(r)).length;
  $("stamp").textContent=n.toLocaleString()+" open roles · last full run "+when(DATA.last_full)
    +" · last partial run "+when(DATA.last_partial||DATA.generated_at);
}

function counts(){
  stamp();
  if(INBATCH){
    for(const b of ["pass","cut"])
      $("c-"+b).textContent=BATCH.roles.filter(r=>r.bucket===b&&matches(r)).length||"";
    return;
  }
  for(const l of ["open","portugal","unsure"]){
    const n=laneIds(l).map(roleById)
      .filter(r=>r&&!routing(r.id)&&!(RR&&isOld(r))&&!isMulti(r)&&matches(r)&&!appliedSame(r)&&!parked(r)).length;
    $("c-"+l).textContent=n||"";
  }
  $("c-agency").textContent=multiIds().map(roleById).filter(r=>r&&!routing(r.id)&&matches(r)).length||"";
  $("c-old69").textContent=["open","portugal","unsure"].flatMap(laneIds)
    .map(roleById).filter(r=>r&&!routing(r.id)&&isOld(r)&&!isMulti(r)&&!appliedSame(r)&&!parked(r)&&matches(r)).length||"";
  if(RR){
    for(const l of ["applied","discarded"])
      $("c-"+l).textContent=(DATA.roles.filter(r=>r.active&&routing(r.id)===l)
        .concat(decided(l)).concat(l==="applied"?LANES.flatMap(laneIds).map(roleById).filter(r=>r&&!routing(r.id)&&appliedSame(r)):[]).filter(matches)).length||"";
    $("c-review").textContent=reviewRows().length||"";
    $("c-favorites").textContent=DATA.roles.filter(r=>r.active&&fav(r.id)&&matches(r)).length||"";
  }
}

let SHOW=200, SHOWN_FOR="";         // Cut holds thousands; draw 200, then more on request
function render(){
  if(!DATA) return;
  if(SHOWN_FOR!==LANE){SHOW=200;SHOWN_FOR=LANE;}
  counts();
  const rows=pool();
  $("list").innerHTML = rows.length ? "" : '<div class="empty">Nothing here.</div>';
  // The pane and every tool on it are his. A visitor gets the list, full width.
  $("split").classList.toggle("nopane",!RR||($("f-pane")&&$("f-pane").checked));
  document.querySelectorAll("label.safari").forEach(l=>{l.hidden=!RR;});
  const total=rows.length;
  if(total>SHOW){rows.length=SHOW;}
  let section=null;
  for(const r of rows){
    const head=INBATCH?null:(LANE==="favorites"?stateOf(r):null);
    if(head&&head!==section){
      section=head;
      const h=document.createElement("div");h.className=INBATCH?"bucket":"sect";
      h.textContent=INBATCH?(head==="pass"?"passed the judge":"cut by the judge")
        :head;
      $("list").appendChild(h);
    }
    const el=document.createElement("div");
    el.className="card"+(SEL===r.id?" sel":"");
    const d=days(r), rt=routing(r.id);
    el.innerHTML='<div class="days'+(dated(r)?'':' approx')+'" title="'
      +(dated(r)?(edited(r)?'updated '+esc(edited(r))+' · ':'')+(r.posted?'posted '+esc(String(r.posted).slice(0,10)):'no posting date')
                :'the posting shows no date anywhere; first seen on radar '
                 +esc(String(r.first_seen||"").slice(0,10))+', so it is at least this old')
      +'">'+ageLabel(r,d)+'</div>'
      +'<div class="body"><div class="t">'+(r.url?'<a href="'+esc(outbound((r.verdict&&r.verdict.read_url)||r.url))+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title))+'</div>'
      +'<div class="c">'+esc(r.company)+'</div>'
      +'<div class="meta">'
      + (RR&&!routing(r.id)&&beenBefore(r)?'<span class="tag" style="border-style:dashed" title="'+esc(historyOf(r).apps.map(a=>(a.role||"role not named")+" · "+(a.sent||"?")+(a.rejected?" · rejected "+a.rejected:"")).concat(historyOf(r).mails.map(m=>m.subject+" · "+m.date)).join("\n"))+'">'+(likelyThis(r).length?'<b style="color:var(--bad)">✉ likely applied to this one</b>':'✉ maybe applied before')+'</span>':'')
      + (RR&&((r.verdict||{}).copies||[]).length?'<span class="tag" style="border-style:dashed" title="the same job is listed '+((r.verdict.copies.length)+1)+' times; this is the one to use">×'+(r.verdict.copies.length+1)+'</span>':'')
      + (openNote(r.id)?'<span class="tag" style="border-style:dashed" title="'+esc(openNote(r.id).text)+'">✎ note</span>':'')
      + (RR&&flagOf(r.id)?'<span class="tag n" style="border-style:dashed">wrong: '+esc(flagOf(r.id).wrong.join(", "))+'</span>':'')
      + (retagOf(r.id)?'<span class="tag" style="border-style:dashed" title="the filter called it '+esc(retagOf(r.id).from)+'; you moved it">you: '
          +esc(LANE_NAME[retagOf(r.id).from]||retagOf(r.id).from)+' → '+esc(LANE_NAME[retagOf(r.id).to])+'</span>':'')
      + (stampOf(r.id)?'<span class="tag" title="what the filter called this role when you acted on it" style="border-style:dashed">was '
          +esc(LANE_NAME[stampOf(r.id)]||stampOf(r.id))+'</span>':'')
      + (r.gone?'<span class="tag n">no longer posted</span>':placeTag(r))
      + (r.location?'<span class="tag">'+esc(r.location)+'</span>':'')
      + (f(r).salary?'<span class="tag y">'+esc(f(r).salary)+'</span>':'')
      + (f(r).years_xp?'<span class="tag">'+f(r).years_xp+'y XP</span>':'')
      + (f(r).seniority?'<span class="tag">'+esc(f(r).seniority)+'</span>':'')
      +'</div></div>'
      +'<div class="side"><span class="causes">'+(RR?causes(r):[]).map(c=>'<span class="tag c-'+c[1]+'" title="'+esc(c[2])+'">'+c[0]+'</span>').join("")+'</span>'
      + (INBATCH?'<div class="acts"><button class="wrong '+(W[wkey(r)]?"on":"")+'" data-w="1">'
            +(W[wkey(r)]?"✓ wrong":"Wrong")+'</button></div>'
         : RR?'<div class="acts">'
          +'<button class="star'+(fav(r.id)?" on":"")+'" data-f="1" title="favorite">'+(fav(r.id)?"★":"☆")+'</button>'
          +(rt?'<button data-d="">clear</button>':'')
          +'<button data-d="discarded" class="'+(rt==="discarded"?"on":"")+'">discard</button>'
          +'<button data-d="applied" class="'+(rt==="applied"?"on":"")+'">applied</button>'+'</div>':'')
      +'</div>';
    el.onclick=()=>{SEL=r.id;render();};
    // Opening the posting selects its row too: he opens it, applies, comes
    // back, and the row he was on has to be the one still highlighted.
    el.querySelectorAll("a").forEach(a=>a.onclick=e=>{e.stopPropagation();SEL=r.id;
      document.querySelectorAll(".card.sel").forEach(c=>c.classList.remove("sel"));
      el.classList.add("sel");renderPane();});
    el.querySelectorAll("button").forEach(b=>b.onclick=e=>{e.stopPropagation();
      if(b.dataset.w) return markWrong(r);
      if(b.dataset.f) return toggleFav(r.id);
      // The button that put a role somewhere takes it back out: clicking an
      // active "discard" un-discards it and the role returns to the lane the
      // judge gave it. Same for "applied". A dead button is a button you have
      // to hunt for "clear" to undo.
      decide(r.id, b.classList.contains("on") ? null : (b.dataset.d||null));});
    $("list").appendChild(el);
  }
  if(total>SHOW){
    const m=document.createElement("div");m.className="acts";m.style.margin="4px 0 20px";
    m.innerHTML='<button>show 200 more · '+(total-SHOW)+' not shown</button>';
    m.querySelector("button").onclick=()=>{SHOW+=200;render();};
    $("list").appendChild(m);
  }
  renderPane();
}

// The description as scraped, from the local server (jd.json is 140MB and
// never ships with the board). Headings, bullets and paragraphs from the
// structure the scrape preserves.
function fmtJD(t){
  const out=[];let list=[];
  const flush=()=>{if(list.length){out.push('<ul>'+list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');list=[];}};
  for(const raw of t.split(/\n+/)){
    const l=raw.trim();if(!l)continue;
    if(/^[•\-*·]\s*/.test(l)){list.push(l.replace(/^[•\-*·]\s*/,''));continue;}
    flush();
    if(l.length<60&&!/[.:,;]$/.test(l)&&l.split(' ').length<=8) out.push('<h4>'+esc(l)+'</h4>');
    else out.push('<p>'+esc(l)+'</p>');
  }
  flush();return out.join('');
}
let jdReq=0;
function loadJD(id){
  const n=++jdReq, el=$("jd"); if(!el) return;
  // Lane roles ship their description inside results.json, so the board
  // works from a static host. Cuts and ghosts still ask the local server.
  if(DATA.jd&&DATA.jd[id]){el.innerHTML=fmtJD(DATA.jd[id]);return;}
  fetch("/api/jd/"+id).then(r=>r.text()).then(t=>{
    if(n!==jdReq||!$("jd")) return;
    $("jd").innerHTML=t.trim()?fmtJD(t):'<span class="none">no description on file for this posting</span>';
  }).catch(()=>{if($("jd"))$("jd").innerHTML='<span class="none">no description on file for this posting</span>';});
}
function fact(k,v){return '<div class="fact"><div class="fk">'+k+'</div><div class="fv">'+(v||"—")+'</div></div>';}
// What the judge extracted from the posting. The pool's own remote/salary
// guesses are metadata; these come from reading the page.
const f = r => (r.fields)||(r.verdict&&r.verdict.fields)||{};
function placeTag(r){
  const v=r.verdict||r.l2||{}, k=f(r).remote;
  if(v.place==="remote") return '<span class="tag y">Remote</span>';
  if(v.place==="pt_onsite") return '<span class="tag y">'+esc(k||"in Portugal")+'</span>';
  if(k) return '<span class="tag">'+esc(k)+'</span>';
  return '<span class="tag">place ?</span>';
}

// Why a role is in Unsure, Cut or Closed, first thing in the preview. There
// are only two questions - is it a role he would take, can it be done from
// (or in) Portugal - so the box names which one it failed, then the words on
// the page that say so. Anything else that kept it out of Open (only the
// board's copy was read, the page would not load) is named as what it is.
// Multihire: companies that flood the boards - an agency listing one job per
// country, an employer reposting the same role every week. The known
// intermediaries arrive already sorted (DATA.agency). The rest is his call,
// one company at a time, from the preview: label it and every role of that
// company, now and in every later run, goes to the Multihire lane.
// The same button puts a company back, for a mislabel - and for one that was
// sorted automatically, where "back" is remembered as an exception. Applying
// to one of its roles changes nothing here: that role goes to Applied, the
// rest of the company stays in the lane.
const coKeys=r=>[coKey(r.company),coKey(((r.verdict||{}).fields||{}).company)].filter(k=>k.length>=2);
const inList=(list,r)=>{const k=new Set((RR&&RR[list]||[]).map(m=>m.key));return coKeys(r).some(x=>k.has(x));};
const autoMulti=r=>false;        // nothing is sent to Bundlers automatically any more (2026-10-05)
const isMulti=r=>autoMulti(r)?!inList("multihire_off",r):inList("multihire",r);
function toggleMulti(r){
  const on=isMulti(r), list=autoMulti(r)?"multihire_off":"multihire", add=autoMulti(r)?on:!on, keys=new Set(coKeys(r));
  RR[list]=(RR[list]||[]).filter(m=>!keys.has(m.key));
  if(add) RR[list].push({key:coKey(r.company),company:r.company,at:new Date().toISOString()});
  writeRR();
  toast(on?r.company+" is out of Bundlers":"every "+r.company+" role moved to Bundlers");
  render();
}
function multiIds(){
  const auto=(DATA.agency||[]).filter(i=>{const r=roleById(i);return r&&isMulti(r);});
  if(!RR||!(RR.multihire||[]).length) return auto;
  const mine=["open","portugal","unsure"].flatMap(laneIds).filter(i=>{const r=roleById(i);return r&&isMulti(r);});
  return [...new Set(auto.concat(mine))];
}
// His history with a company. Companies reject and repost, and a posting
// comes back under a slightly different title, so "have I applied here?" is
// asked of the company, not the posting: every application his inbox proves
// (RR.applications, from the email sweep), every "applied" he clicked on
// another of its roles, and any other email that names it (RR.inbox).
// A role that would be Open at such a company is not hidden and not marked
// applied - one application is one posting - it moves to its own lane,
// "Applied before", with the history beside it, and he decides.
const CO_JUNK=/\b(app|inc|llc|ltd|gmbh|labs|foundation|bank|ai|cro|careers|social|ug|intelligent|cloud|communications|life|technologies|software|group|the)\b/gi;
const coKey=n=>String(n||"").toLowerCase().replace(/careers$/,"").replace(CO_JUNK," ").replace(/[^a-z0-9]/g,"").replace(/\d+$/,"");
function historyOf(r){
  if(!RR) return {apps:[],mails:[]};
  const keys=new Set([coKey(r.company),coKey(((r.verdict||{}).fields||{}).company)].filter(k=>k.length>=3));
  const apps=(RR.applications||[]).filter(a=>keys.has(coKey(a.company)))
    .map(a=>({role:a.role,sent:a.applied,approx:a.approx,rejected:a.rejected,withdrawn:a.withdrawn,
              callback:(a.callbacks||[]).filter(c=>!c.auto).map(c=>c.date)[0],tids:a.tids||[]}));
  const tids=new Set(apps.flatMap(a=>a.tids));
  for(const d of RR.decisions) if(d.decision==="applied"&&d.id!==r.id&&!d.by&&keys.has(coKey(d.company))
      &&!apps.some(a=>a.role===d.title)) apps.push({role:d.title,sent:String(d.at||"").slice(0,10),clicked:true,tids:[]});
  const mails=[...keys].flatMap(k=>(RR.inbox||{})[k]||[]).filter(m=>!tids.has(m.tid)&&String(m.date)>=SINCE);
  return {apps:apps.filter(a=>!a.sent||a.sent>=SINCE).sort((a,b)=>String(b.sent||"").localeCompare(String(a.sent||""))),mails};
}
// an application his inbox proves, or an email from the company that reads like one
// This search began in June 2026. What he applied to before that is another
// job hunt: those postings are long gone and he would apply again without a
// thought, so nothing older counts as history.
const SINCE="2026-06-01";
// The anchor is the company. A title alone means nothing - hundreds of
// companies have a "Senior Product Designer" - so the question is only ever
// asked inside one company: he has applied here; is this posting that job?
//   same level, and one title's words inside the other's      -> likely this one
//       "Senior Product Designer"  /  "Senior Product Designer (Growth)"
//   same level, mostly the same words                          -> maybe the same job
//   another level, or another kind of role                     -> a different job:
//       "UX Designer"  /  "Head of Design". It stays in Open, untagged.
// An email that never names the role cannot be compared, so it counts as maybe.
const LEVELS=["junior","mid","senior","staff","principal","lead","manager","head","director","vp","founding"];
const TW_STOP=new Set(["the","a","an","and","of","for","to","in","at","remote","m","f","d","x","mfd","fmd","eu","emea","europe","contract"]);
const tw=t=>(String(t||"").toLowerCase().replace(/\bsr\b\.?/g,"senior").replace(/\bjr\b\.?/g,"junior")
  .replace(/vice president/g,"vp").match(/[a-z0-9]+/g)||[]).filter(w=>!TW_STOP.has(w));
const levelOf=t=>tw(t).filter(w=>LEVELS.includes(w)).sort().join("+");
const coreOf=t=>new Set(tw(t).filter(w=>!LEVELS.includes(w)));
function roleMatch(mailTitle,postTitle){
  if(!mailTitle) return "maybe";
  const la=levelOf(mailTitle), lb=levelOf(postTitle);
  if(la&&lb&&la!==lb) return null;
  const a=coreOf(mailTitle), b=coreOf(postTitle);
  if(!a.size||!b.size) return null;
  const both=[...a].filter(w=>b.has(w)).length;
  if(both===a.size||both===b.size) return la===lb?"likely":"maybe";
  return both/(a.size+b.size-both)>=.6?"maybe":null;
}
const sameRole=(m,p)=>roleMatch(m,p)==="likely";
const likelyThis=r=>historyOf(r).apps.filter(a=>sameRole(a.role,r.title));
// Applied before, as he set it on 2026-10-05: a role counts as applied when
// he applied to the EXACT same job - same company, same title word for word -
// in the last three months. Anything else is a different job and stays in
// its lane. There is no "Applied before" lane any more.
const MONTHS3=new Date(Date.now()-92*864e5).toISOString().slice(0,10);
const exactRole=(a,b)=>tw(a).join(" ")===tw(b).join(" ")&&tw(a).length>0;
const appliedSame=r=>!!RR&&historyOf(r).apps.some(a=>a.sent&&a.sent>=MONTHS3&&exactRole(a.role,r.title));
const beenBefore=appliedSame;
// The same job, listed elsewhere. One card is shown; these are the others.
function copiesBox(r){
  const c=(r.verdict||{}).copies||[];
  if(!c.length) return "";
  const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return u||"";}};
  return '<div class="notes"><div class="fk">The same job, also listed</div>'
    +c.map(x=>'<div class="past"><div><a href="'+esc(outbound(x.read_url||x.url))+'" target="_blank" rel="noopener" style="color:var(--acc)">'
        +esc(host(x.read_url||x.url))+' ↗</a>'+(x.location?' · '+esc(x.location):'')+'</div><div class="when">'
        +(x.posted?'posted '+esc(String(x.posted).slice(0,10))+' · ':'')+esc(x.read==="employer"?"the employer’s page":"a job board’s copy")
        +' · the filter called it '+esc(LANE_NAME[x.lane]||x.lane||"?")+'</div></div>').join("")+'</div>';
}
function historyBox(r){
  const h=historyOf(r);
  if(!h.apps.length&&!h.mails.length) return "";
  const mail=t=>'<a style="color:var(--dim)" target="_blank" rel="noopener" href="https://mail.google.com/mail/?authuser=cesarxdesign@gmail.com#all/'+esc(t)+'">✉</a>';
  return '<div class="notes"><div class="fk">Your history with this company</div>'
    +h.apps.map(a=>'<div class="past"'+(sameRole(a.role,r.title)?' style="border-left-color:var(--bad)"':'')+'><div>'+esc(a.role||"role not named in the email")
        +(sameRole(a.role,r.title)?' <b style="color:var(--bad)">· most likely this posting</b>'
          :roleMatch(a.role,r.title)?' <b>· maybe this posting</b>':' <span style="color:var(--dimmer)">· a different role</span>')+'</div><div class="when">'
        +(a.clicked?'you marked it applied ':'applied '+(a.approx?'around ':''))+esc(a.sent||"?")
        +(a.callback?' · <span style="color:var(--good)">callback '+esc(a.callback)+'</span>':'')
        +(a.rejected?' · <span style="color:var(--bad)">rejected '+esc(a.rejected)+'</span>':'')
        +(a.withdrawn?' · you withdrew '+esc(a.withdrawn):'')
        +(!a.rejected&&!a.callback&&!a.clicked?' · no reply':'')+' '+a.tids.map(mail).join(" ")+'</div></div>').join("")
    +h.mails.map(m=>'<div class="past"><div>'+esc(m.subject)+'</div><div class="when">'+esc(m.date)+' · '+esc(m.from)+' '+mail(m.tid)+'</div></div>').join("")
    +'</div>';
}
// Notes: anything he wants looked at later, on any role in any lane. One
// open note per role, saved in the routing file with what the board showed at
// the time. A note that has been read is marked reviewed (with the answer,
// when there is one) and stays as history; the box opens again for the next.
const DRAFT={};       // what he has typed and not saved yet, so a re-render does not eat it
const openNote=id=>RR&&(RR.notes||[]).find(n=>n.id===id&&!n.reviewed);
// Notes save themselves, a moment after he stops typing. Nothing is redrawn:
// redrawing would take the cursor out of the box mid-sentence.
function autoNote(r,text){
  DRAFT[r.id]=text;
  clearTimeout(autoNote.t);
  autoNote.t=setTimeout(()=>{
    const v=r.verdict||{}, cur=openNote(r.id), t=text.trim(), now=new Date().toISOString();
    RR.notes=(RR.notes||[]).filter(n=>n!==cur);
    if(t) RR.notes.push({id:r.id,at:cur?cur.at:now,edited:now,text:t,
      company:r.company,title:r.title,url:r.url,read_url:v.read_url,label:labelOf(r),tab:cur?cur.tab:LANE,by:reader(r),
      role:v.role,place:v.place,reason:v.reason,reviewed:null});
    writeRR();
    const s=$("note-state"); if(s&&SEL===r.id) s.textContent=t?"saved "+new Date().toTimeString().slice(0,5)+" · not reviewed yet":"note removed";
  },700);
}
function saveNote(r,text){
  const v=r.verdict||{}, cur=openNote(r.id);
  text=text.trim();
  RR.notes=(RR.notes||[]).filter(n=>n!==cur);
  if(text) RR.notes.push({id:r.id,at:cur?cur.at:new Date().toISOString(),edited:new Date().toISOString(),text,
    company:r.company,title:r.title,url:r.url,read_url:v.read_url,label:labelOf(r),tab:LANE,by:reader(r),
    role:v.role,place:v.place,reason:v.reason,reviewed:null});
  delete DRAFT[r.id];
  writeRR();toast(text?"note saved":"note removed");render();
}
function notesBox(r){
  if(!RR) return "";
  const past=(RR.notes||[]).filter(n=>n.id===r.id&&n.reviewed).sort((a,b)=>a.at.localeCompare(b.at));
  const cur=openNote(r.id);
  return '<div class="notes"><div class="fk">Notes</div>'
    +past.map(n=>'<div class="past"><div>'+esc(n.text)+'</div>'+(n.answer?'<div class="ans">↳ '+esc(n.answer)+'</div>':'')
        +'<div class="when">'+esc(n.at.slice(0,10))+' · reviewed '+esc(String(n.reviewed).slice(0,10))+'</div></div>').join("")
    +'<textarea id="note" placeholder="anything about this role to look at later">'+esc(DRAFT[r.id]!=null?DRAFT[r.id]:cur?cur.text:"")+'</textarea>'
    +'<div id="note-state" style="color:var(--dim);font-size:12px;margin-top:4px">'
    +(cur?'saved '+esc(cur.edited.slice(0,16).replace("T"," "))+' · not reviewed yet':'saves as you type')+'</div></div>';
}
// The same answer as the box, as tags on the card: which question kept this
// role out of Open, readable down the list without opening each one.
function causes(r){
  const c=causesOnly(r);
  return c.length&&reader(r)==="vision"?c.concat([["vision","who","read on its real page, in a browser"]]):c;
}
function causesOnly(r){
  // Every role carries the same three tags, so a row reads at a glance:
  // green passed, red is what kept it out of Open, grey was never the
  // question - the page was closed or unreadable, or the answer rested on
  // something else. Language, Page and Closed only show when they fired.
  const v=r.verdict||{}, lab=labelOf(r);
  if(reader(r)==="judge"){
    if(!v.judged) return [];
    const t=(k,x,yes,no)=>[k,x==="no"?"bad":x==="unclear"||!x?"off":"ok",x==="no"?no:x==="unclear"||!x?"the old judge could not tell":yes];
    return [t("role",v.role,"a role you would take","not a role you would take"),
            t("location",v.place,"can be done from Portugal","cannot be done from Portugal"),
            ["source","off","the old judge read scraped text, never the page"],
            ["judge","who","read by the old judge, not on its real page: the least reliable call on the board"]];
  }
  const off=(k,why)=>[k,"off",why], src=v.read==="employer";
  if(lab==="closed"||v.open==="no")
    return [off("role","not judged: the job is closed"),off("location","not judged: the job is closed"),
            ["closed","bad","the page says the job is no longer open"]];
  if(/different job/.test(v.reason||"")||v.open==="unreadable"||/could not be read in the browser/.test(v.reason||""))
    return [off("role","not judged: the page was not read"),off("location","not judged: the page was not read"),
            ["page","bad",/different job/.test(v.reason||"")?"the page read was a different job":"the page could not be read"]];
  const out=[];
  out.push(v.role==="no"?["role","bad","not a role you would take"]
    :v.role==="unclear"?["role","bad","could not tell what the role is"]:["role","ok","a role you would take"]);
  out.push(v.place==="no"?["location","bad","cannot be done from Portugal"]
    :v.place==="unclear"?["location","bad","the page does not clearly say where, or says both"]
    :["location","ok",v.place==="pt_onsite"?"in Portugal, at an office":"can be done from Portugal"]);
  out.push(src?["source","ok","read on the employer's own page"]
    :off("source","read on a job board's copy: the employer's own page was not found"));
  if(v.language_ok===false) out.push(["language","bad","written in "+(v.language||"another language")]);
  return out;
}
function whyBox(r){
  const v=r.verdict||{}, lab=labelOf(r);
  if(!RR) return "";
  const f=flagOf(r.id), on=k=>f&&f.wrong.includes(k);
  const q=(k,h,ok)=>'<div class="vq">'+(RR?'<button class="flag'+(on(k)?" on":"")+'" data-k="'+k+'" title="this part of the reasoning is wrong">'
      +(on(k)?"✗ wrong":"wrong?")+'</button>':'')+'<span class="k'+(ok?" ok":"")+'">'+k+'</span><span class="h">'+esc(h)+'</span></div>';
  const sig=(v.signals||[]).map(x=>'<li><span class="'+(x.says==="portugal_in"?"in":"out")+'">'
      +(x.says==="portugal_in"?"Portugal in":"Portugal out")+'</span> · '+esc(x.where||"")+' · “'+esc(x.quote||"")+'”</li>').join("");
  const quote=v.quote?'<li>“'+esc(v.quote)+'”</li>':"";
  const sum=v.reason?'<div class="sum">Reader’s summary: '+esc(v.reason)+'</div>':"";
  // what he can do about it sits with the reasoning: move it to the lane it belongs in
  const cur=retagOf(r.id), from=cur?cur.from:lab;
  const move='<div class="vq" style="margin-top:12px"><span class="k ok" style="color:var(--dim);border-color:var(--line)">move to</span>'
    +RETAG.map(t=>t===from&&!cur?'<button class="flag" disabled style="opacity:.4;cursor:default">'+LANE_NAME[t]+'</button>'
      :t===from?'<button class="flag" data-t="'+cur.to+'" title="put it back where the filter had it">'+LANE_NAME[t]+'</button>'
      :'<button class="flag'+(cur&&cur.to===t?" on":"")+'" data-t="'+t+'">'+(cur&&cur.to===t?"✓ ":"")+LANE_NAME[t]+'</button>').join("")
    +(cur?'<span style="color:var(--dim);font-size:12px">you moved it from '+esc(LANE_NAME[cur.from]||cur.from)+'</span>':'')+'</div>';
  const who='<div class="sum">'+(reader(r)==="vision"?'Read by <b>VISION</b>, on its real page'+(v.read_at?' · '+esc(String(v.read_at).slice(0,10)):'')
    :'Read by the <b>old judge</b>, from scraped text, never on its real page. Treat this call as unverified.')+'</div>';
  const wrap=(x,ok)=>'<div class="verdict'+(ok?" ok":"")+'">'+x+sum+who+move+'</div>';
  if(reader(r)==="judge"){
    if(!v.judged) return "";
    const st=(k,x,yes,no)=>q(k,x==="no"?no:x==="unclear"||!x?"The old judge could not tell":yes,x!=="no"&&x!=="unclear"&&!!x);
    return wrap(st("role",v.role,"A role you would take","Not a role you would take")
      +st("location",v.place,"Can be done from Portugal","Cannot be done from Portugal")
      +'<ul>'+(v.why||[]).map(w=>'<li>'+esc(w)+'</li>').join("")+'</ul>',lab!=="cut");
  }
  if(lab==="closed"||v.open==="no")
    return wrap(q("closed","The page says this job is no longer open")
      +'<ul>'+(v.why||[]).filter(w=>/page says|employer|answered/.test(w)).map(w=>'<li>'+esc(w)+'</li>').join("")+'</ul>');
  // when the page itself was the problem there is no verdict on role or place to show
  if(/different job/.test(v.reason||""))
    return wrap(q("page","The page that was read is not this job, so nothing was decided"));
  if(v.open==="unreadable"||/could not be read in the browser/.test(v.reason||""))
    return wrap(q("page","The page could not be read, so nothing was decided")
      +(v.quote?'<ul><li>the page showed: “'+esc(v.quote)+'”</li></ul>':""));
  const shaky=/not sure of it|two readings disagree/.test(v.reason||"");
  let out="";
  if(v.language_ok===false) out+=q("language","The posting is written in "+(v.language||"another language"));
  // the two questions, always both in review, so either can be called wrong
  if(v.role==="no") out+=q("role","Not a role you would take");
  else if(v.role==="unclear") out+=q("role","Could not tell what the role is");
  else out+=q("role","A role you would take",true);
  if(v.place==="no") out+=q("location",shaky?"Probably cannot be done from Portugal, but the reading was not certain":"Cannot be done from Portugal")+'<ul>'+(sig||quote)+'</ul>';
  else if(v.place==="unclear"){
    const both=(v.signals||[]).some(x=>x.says==="portugal_in")&&(v.signals||[]).some(x=>x.says==="portugal_out");
    out+=q("location",both?"The page says both: Portugal in, and Portugal out":"The page does not clearly say where")+'<ul>'+(sig||quote)+'</ul>';
  }
  else out+=q("location",v.place==="pt_onsite"?"In Portugal, at an office":"Can be done from Portugal",true)+'<ul>'+(sig||quote)+'</ul>';
  out+=q("source",v.read==="employer"?"Read on the employer’s own page":"Read on a job board’s copy; the employer’s own page was not found",v.read==="employer");
  return wrap(out,["open","portugal"].includes(lab));
}

    + (r.url?'<a href="'+esc(outbound(r.url))+'" target="_blank" rel="noopener" style="color:var(--acc)">'+(v.read_url&&v.read_url!==r.url?'the board\'s copy':'Open posting')+' ↗</a>':'')
    + (LOCAL&&v.shot?'<details class="why"><summary>the page as it was read</summary><img src="'+esc(v.shot)+'?t='+esc(v.read_at||"")+'" style="width:100%;border:1px solid var(--line);border-radius:8px;margin-top:8px" onerror="this.parentNode.remove()"></details>':'')
;

// ---------- Evidence ----------
// Facts to weigh a call with; none of them decides a lane. The date the board
// gives against the date the employer gives, what the employer's own board
// lists when only a board's copy was read, and the real company's posting
// when an agency names who it is hiring for.
function evidenceBox(r){
  const e=(r.verdict&&r.verdict.evidence)||{}, L=[];
  const link=(u,t)=>'<a href="'+esc(outbound(u))+'" target="_blank" rel="noopener" style="color:var(--acc)">'+esc(t)+' ↗</a>';
  if(e.board_posted||e.employer_posted)
    L.push("Posted · "+[e.employer_posted&&("employer "+esc(e.employer_posted)), e.board_posted&&("board "+esc(e.board_posted)),
      r.first_seen&&("first seen "+esc(String(r.first_seen).slice(0,10)))].filter(Boolean).join(" · "));
  const b=e.employer_board;
  if(b) L.push(b.listed
    ? "The employer lists this role on its own board ("+esc(b.source)+"): "+link(b.url,"its posting")
    : "The employer's own board ("+esc(b.source)+", "+b.jobs+" jobs) does not list this title."
      +(b.design&&b.design.length?" Design roles it does list: "+b.design.map(esc).join("; ")+".":" It lists no design roles."));
  const h=e.hiring_for;
  if(h) L.push("Hiring for "+esc(h.company)+". "+(h.listed?link(h.url,esc(h.company)+"'s own posting")
    : esc(h.company)+"'s own board ("+esc(h.source)+", "+h.jobs+" jobs) does not list this title."));
  return L.length?'<div class="why"><b>Evidence</b><br>'+L.join("<br>")+'</div>':"";
}

// ---------- RadarRouting ----------
// Every decision is written straight back to the file on the Desktop.
// createWritable() stages to a swap file and only replaces the original on
// close(), so a crash mid-write leaves the previous routing intact.
function decide(id,d){
  const r=roleById(id);
  RR.decisions=RR.decisions.filter(x=>x.id!==id);
  if(d){
    const f=(r.verdict&&r.verdict.fields)||{}, v=r.verdict||{};
    // Snapshot what Radar knew at the moment he decided. The posting will
    // come down; the history should not thin out with it.
    // The stamp: what the filter called this role at the moment he acted on
    // it, and why. A tab is where a role sits today; the stamp is what it was
    // labeled, kept for good. An application to a role stamped Unsure is the
    // evidence for whether Unsure was the right call.
    RR.decisions.push({id,decision:d,company:r.company,title:r.title,
      at:new Date().toISOString(),url:r.url,location:r.location,
      workplace:r.workplace,source:r.source,posted:r.posted,
      label:labelOf(r),label_why:v.why,label_read:v.read,label_stage:v.stage,
      lane:v.lane,seniority:f.seniority,remote:f.remote,salary:f.salary,
      countries:f.countries});
  }
  writeRR(); render();
}
// Written the instant you click, one write at a time. The swap file only
// replaces the original on close(), so a quit mid-write keeps the previous
// routing; the "routing saved" toast means the click is on disk.
let rrChain = Promise.resolve();
function writeRR(){
  if(!RRH) return;
  // Spread first: the file also carries applications and milestones, and a
  // write that named only decisions and favorites would drop them.
  rrChain = rrChain.then(async()=>{
    try{
      await pullNotes();
      const snapshot=JSON.stringify({...RR,updated:new Date().toISOString(),decisions:RR.decisions,favorites:RR.favorites},null,1);
      const w=await RRH.createWritable();
      await w.write(snapshot);
      await w.close();
      LASTMOD=(await RRH.getFile()).lastModified;
    }catch(e){toast("ROUTING NOT SAVED: "+e.message);}
  });
}
// His notes are read in a Claude session, which marks them reviewed in the
// file itself. The board holds the file in memory and writes all of it back,
// so before every write, and whenever the window comes back into focus, it
// looks at what changed on disk and takes the review marks from there.
let LASTMOD=0;
async function pullNotes(){
  if(!RRH) return false;
  const f=await RRH.getFile();
  if(f.lastModified<=LASTMOD) return false;
  LASTMOD=f.lastModified;
  let ext; try{ext=JSON.parse(await f.text());}catch(e){return false;}
  let changed=false;
  for(const x of ext.notes||[]){
    const n=(RR.notes||[]).find(n=>n.id===x.id&&n.at===x.at);
    if(n&&x.reviewed&&(!n.reviewed||n.answer!==x.answer)){n.reviewed=x.reviewed;n.answer=x.answer;changed=true;}
  }
  // the sweep's findings are written from outside too: his applications, and
  // the inbox search by company. The file's copy of those is always the truth.
  // and the roles the sweep is certain he applied to: add the ones the board has not got
  for(const d of ext.decisions||[])
    if(d.by&&!RR.decisions.some(x=>x.id===d.id)){RR.decisions.push(d);changed=true;}
  // flags he has ruled on are filed away from outside (the review page); they leave For Reviewing here too
  if(ext.flags_done){
    const d=new Set(ext.flags_done.map(x=>x.id)), left=(RR.flags||[]).filter(x=>!d.has(x.id));
    if(left.length!==(RR.flags||[]).length||!RR.flags_done||RR.flags_done.length!==ext.flags_done.length){RR.flags=left;RR.flags_done=ext.flags_done;changed=true;}
  }
  // a milestone added from outside (a Claude session) is kept; removing one is done here
  for(const m of ext.milestones||[])
    if(!(RR.milestones||[]).some(x=>x.date===m.date&&x.label===m.label)){RR.milestones=[...(RR.milestones||[]),m];changed=true;}
  for(const k of ["applications","inbound","inbox","battery"])
    if(ext[k]&&JSON.stringify(ext[k])!==JSON.stringify(RR[k])){RR[k]=ext[k];changed=true;}
  return changed;
}
window.addEventListener("focus",async()=>{try{if(await pullNotes()) render();}catch(e){}});
function rrUI(on){
  document.querySelectorAll(".tab.rr").forEach(t=>{t.hidden=!on;});
  if(!on&&!["open","portugal","unsure"].includes(LANE)){LANE="open";
    document.querySelectorAll(".tab:not(.bt)").forEach(x=>x.classList.toggle("on",x.dataset.lane===LANE));}
  const b=$("route");
  b.textContent=on?"⇱ RadarRoute · on":"⇱ RadarRoute";
  b.title=on?"RadarRouting.json is attached; every decision writes back to it":"Drop RadarRouting.json here, or click to pick it";
}
async function adopt(h){
  const d=JSON.parse(await (await h.getFile()).text());
  if(!d||!Array.isArray(d.decisions)) throw new Error("not a routing file");
  d.favorites=Array.isArray(d.favorites)?d.favorites:[];
  RRH=h; RR=d; LASTMOD=(await h.getFile()).lastModified;
  try{await idb("readwrite",s=>s.put(h,"h"));}catch(e){}
  rrUI(true); render(); $("export").hidden=!LOCAL;
}
function idb(mode,fn){return new Promise((res,rej)=>{const r=indexedDB.open("radar2-rr",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onerror=()=>rej(r.error);
  r.onsuccess=()=>{const q=fn(r.result.transaction("h",mode).objectStore("h"));
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);};});}

(function(){
  const b=$("route");
  b.onclick=async()=>{
    if(!window.showOpenFilePicker) return toast("Needs Chrome — Safari can't write files.");
    if(STORED&&!RR){
      // the file from last time; Chrome wants a click before it lets us write again
      try{if(await STORED.requestPermission({mode:"readwrite"})==="granted"){await adopt(STORED);return;}}
      catch(e){}
    }
    try{const [h]=await window.showOpenFilePicker({types:[{description:"RadarRouting",accept:{"application/json":[".json"]}}]});await adopt(h);}
    catch(e){if(e.name!=="AbortError") toast("Not a RadarRouting file.");}
  };
  b.addEventListener("dragover",e=>{e.preventDefault();b.classList.add("drop");});
  b.addEventListener("dragleave",()=>b.classList.remove("drop"));
  b.addEventListener("drop",async e=>{
    e.preventDefault();b.classList.remove("drop");
    const it=e.dataTransfer.items&&e.dataTransfer.items[0];
    if(!it||!it.getAsFileSystemHandle) return toast("Needs Chrome — Safari can't write files.");
    try{const h=await it.getAsFileSystemHandle();if(h.kind!=="file")throw 0;await adopt(h);}
    catch(err){toast("Not a RadarRouting file.");}
  });
  rrUI(false);
  (async()=>{try{const h=await idb("readonly",s=>s.get("h"));
    if(!h) return;
    STORED=h;
    if(await h.queryPermission({mode:"readwrite"})==="granted") await adopt(h);
    else{b.textContent="⇱ RadarRoute · reconnect";b.title="Click to reattach "+h.name;}}catch(e){}})();
})();

document.querySelectorAll(".tab[data-lane]").forEach(t=>t.onclick=()=>{
  if(t.classList.contains("bt")) BUCKET=t.dataset.lane; else LANE=t.dataset.lane;
  SEL=null;
  document.querySelectorAll(t.classList.contains("bt")?".tab.bt":".tab:not(.bt)")
    .forEach(x=>x.classList.toggle("on",x===t));
  render();});

// Data reloads without the page: selection, tab and routing all stay.
function load(){
  return fetch("data/results.json?t="+Date.now()).then(r=>r.json()).then(d=>{
    DATA=d;
    // What is on the board is only what has been READ on its own page. The
    // rest of the design-titled roles are waiting their turn, and the line
    // says how many, so a short lane is never mistaken for a short market.
    stamp();
    render();
  }).catch(()=>{$("stamp").textContent="no data/results.json yet — run pool.py, judge.py, results.py";});
}
wireFilters();
$("batch").onclick=()=>INBATCH?completeBatch():setBatch(true);
$("export").onclick=async()=>{
  const b=$("export");b.disabled=true;b.textContent="writing…";
  try{
    const d=await (await fetch("/api/export",{method:"POST",body:"{}"})).json();
    if(!d.ok) throw new Error(d.msg||"failed");
    // The server writes it beside the pipeline so a Claude session can read
    // it in place; this hands him the same file to drop into a chat.
    const res=await fetch("/data/applied_history.json?t="+Date.now());
    const url=URL.createObjectURL(await res.blob());
    const a=document.createElement("a");
    a.href=url;a.download="applied_history.json";document.body.appendChild(a);
    a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    b.className="route done";b.textContent="✓ "+d.msg.split(" -> ")[0];
    toast("downloaded · also written to radar2/data/applied_history.json and .md");
  }catch(e){alert("Not written: "+e.message);b.textContent="⇱ Export history";}
  finally{b.disabled=false;setTimeout(()=>{b.className="route";b.textContent="⇱ Export history";},6000);}
};
load();
</script>
